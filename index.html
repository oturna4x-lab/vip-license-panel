<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP License Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>

  <header class="topbar">
    <div class="brand"><span class="shield">◆</span> VIP License Panel</div>
    <button class="menu" aria-label="Menu"><span></span><span></span><span></span></button>
  </header>

  <main class="container">
    <section class="welcome">Welcome, Admin</section>

    <section class="card">
      <div class="card-head">
        <h1><span>⚿</span> Create License (Random)</h1>
        <button class="view-btn" id="viewKeys">♧ View Keys</button>
      </div>

      <div class="form">
        <label>Application</label>
        <select id="app">
          <option>Demo App</option>
          <option>Premium Tool</option>
          <option>Creator Dashboard</option>
        </select>

        <label>Max Devices</label>
        <input id="devices" type="number" min="1" max="99" value="1">

        <label>Duration</label>
        <select id="duration">
          <option value="5" data-price="70">5 Hours — ₹70/Device</option>
          <option value="24" data-price="120">24 Hours — ₹120/Device</option>
          <option value="168" data-price="300">7 Days — ₹300/Device</option>
          <option value="720" data-price="700">30 Days — ₹700/Device</option>
        </select>

        <label>Estimation</label>
        <input id="estimate" type="text" value="70.00" readonly>

        <button class="generate" id="generate">⚿ &nbsp; Generate License</button>
      </div>
    </section>

    <section class="tips">
      <h2>ⓘ Tips</h2>
      <p>Price = devices × unit price (duration).</p>
      <p>After generation, a popup shows your demo license key; you can copy it.</p>
    </section>

    <section class="keys card hidden" id="keysPanel">
      <div class="card-head">
        <h1>♧ Generated Keys</h1>
        <button class="view-btn" id="closeKeys">Close</button>
      </div>
      <div id="keyList" class="key-list"></div>
    </section>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-box">
      <button class="close" id="closeModal">×</button>
      <div class="modal-icon">✓</div>
      <h2>License Generated</h2>
      <p>Your demo license key is:</p>
      <div class="key" id="newKey"></div>
      <button class="copy" id="copy">Copy Key</button>
    </div>
  </div>

  <footer>© 2026 VIP License Panel — Demo</footer>
  <script src="script.js"></script>
</body>
</html>
